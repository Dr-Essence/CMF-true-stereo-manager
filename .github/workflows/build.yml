name: Build APK

on:
  push:
    # main publishes (below); claude/* branches only build, into this run's artifacts.
    branches: [main, 'claude/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the version code is derived from the commit count.
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The default list includes the legacy 'tools' package, which
          # sdkmanager no longer offers - the step then fails before anything
          # is built. Gradle fetches the platform and build-tools it needs.
          packages: platform-tools

      - uses: gradle/actions/setup-gradle@v4

      # The permanent release key, from the repository secrets. Without it a
      # build still runs (debug-signed), but a release is refused below: an
      # APK signed with another key cannot update the installed app.
      - name: Signing key
        env:
          KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "SIGNING_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "signed with the release key"
          else
            echo "::warning::SIGNING_KEYSTORE_B64 not set - debug-signed build"
          fi

      - name: Build release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      # Two editions: pro (full manager with developer tools) and clean
      # (everyday, Nothing-styled). Both installable side by side.
      - name: Rename
        run: |
          mkdir -p out
          SHA=$(git rev-parse --short HEAD)
          for ED in pro clean; do
            DIR=app/build/outputs/apk/$ED/release
            VER=$(grep -m1 versionName $DIR/output-metadata.json | cut -d'"' -f4 || echo unknown)
            cp $DIR/app-$ED-release.apk "out/CMF-true-stereo-$ED-v${VER}-${SHA}.apk"
          done
          # The left/right test app: its own folder, uploaded as the "lr-test" artifact,
          # and attached to tagged releases only (shipped with an app update), never
          # to the rolling "Latest build" (which uploads out/ only).
          mkdir -p test-out
          cp modetest/build/outputs/apk/release/modetest-release.apk "test-out/CMF-LR-test-${SHA}.apk"
          echo "VER=$VER" >> "$GITHUB_ENV"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk

      # CMF L/R Test: in this run's artifacts only (a GitHub login to download).
      - uses: actions/upload-artifact@v4
        with:
          name: lr-test
          path: test-out/*.apk

      # Actions artifacts need a login to download and expire after 90 days.
      # A rolling prerelease gives every main build a permanent, public URL.
      # Pushes only: a hand-run release on a commit the push already built would
      # upload the same file names again, which GitHub refuses (and that
      # failure skipped the release step below).
      - name: Publish rolling build
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          body: |
            Automatic build of `main`. Debug-signed, for sideloading.

            Two editions, installable side by side:
            - `clean`: CMF Stereo, for everyday use (Nothing style, plain 1-10 levels)
            - `pro`: CMF Stereo Pro, the full manager with developer tools

            Needs the [CMF-true-stereo](https://github.com/Dr-Essence/CMF-true-stereo)
            module installed. Tagged releases are the stable ones; this tag
            moves with every push.
          files: out/*.apk

      - name: Release notes
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          if [ -z "${SIGNING_KEYSTORE:-}" ]; then
            echo "::error::No release key (SIGNING_KEYSTORE_B64 secret) - not publishing a release that could not update the installed app"
            exit 1
          fi
          # This version's notes (if any), then the footer every release carries.
          : > release-body.md
          [ -f "docs/releases/v$VER.md" ] && cat "docs/releases/v$VER.md" >> release-body.md
          cat docs/releases/footer.md >> release-body.md
          NOTES=release-body.md
          echo "NOTES=$NOTES" >> "$GITHUB_ENV"

      # Running this workflow by hand on main publishes a proper (non-
      # prerelease) release, tagged with the app's version.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          target_commitish: ${{ github.sha }}
          name: CMF-true-stereo manager v${{ env.VER }}
          # docs/releases/v<version>.md when it exists (the Release notes
          # workflow keeps it in sync afterwards), else the generic text.
          body_path: ${{ env.NOTES }}
          files: |
            out/*.apk
            test-out/*.apk
